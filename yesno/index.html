<html lang="en">

<style>
  :root {
    --wheat:        #f6e7c9;   /* warm cream background */
    --wheat-light:  #fbf3e0;
    --dusk:         #3a2233;   /* deep plum for text on light */
    --barn:         #8a3b2e;   /* barn red */
    --barn-deep:    #6e2c22;
    --sunset:       #e07a3c;   /* sunset orange */
    --sunset-soft:  #f0a763;
    --denim:        #2f5d73;   /* denim blue */
    --denim-deep:   #22475a;
    --gold:         #d9a544;
    --cream-ink:    #4a3a24;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
    color: var(--dusk);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--sunset-soft) 0%, rgba(240,167,99,0) 55%),
      radial-gradient(120% 90% at 50% 120%, rgba(47,93,115,0.35) 0%, rgba(47,93,115,0) 60%),
      var(--wheat);
    min-height: 100dvh;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  h1, h2, .q-text, .tally { font-family: 'Fraunces', Georgia, serif; }

  .screen {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
  }
  body:not(.in-game):not(.complete) #startScreen { display: flex; }
  body.in-game #gameScreen { display: flex; }
  body.complete #completeScreen { display: flex; }

  /* ---------- Start screen ---------- */
  .kicker {
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--barn);
    margin-bottom: 12px;
  }
  #startScreen h1 {
    font-size: clamp(2.6rem, 12vw, 4.4rem);
    line-height: 0.98;
    margin: 0 0 8px;
    font-weight: 700;
    color: var(--dusk);
    font-variation-settings: 'opsz' 120;
  }
  #startScreen h1 .amp { color: var(--sunset); font-style: italic; }
  .subtitle {
    font-size: 1.06rem;
    max-width: 22rem;
    color: var(--cream-ink);
    margin: 6px 0 30px;
    line-height: 1.4;
  }
  .btn {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 1.12rem;
    border: none;
    border-radius: 999px;
    padding: 16px 44px;
    color: var(--wheat-light);
    background: var(--barn);
    box-shadow: 0 6px 0 var(--barn-deep), 0 12px 24px rgba(110,44,34,0.35);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--barn-deep), 0 6px 14px rgba(110,44,34,0.35);
  }
  .btn.ghost {
    background: var(--denim);
    box-shadow: 0 6px 0 var(--denim-deep), 0 12px 24px rgba(34,71,90,0.35);
  }
  .btn.ghost:active { box-shadow: 0 2px 0 var(--denim-deep), 0 6px 14px rgba(34,71,90,0.35); }
  .rule { font-size: 0.95rem; color: var(--cream-ink); margin-top: 22px; opacity: 0.85; }
  .rule b { color: var(--barn); }

  /* ---------- Game screen ---------- */
  #gameScreen { justify-content: space-between; }
  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .progress { display: flex; gap: 7px; flex-wrap: wrap; max-width: 70%; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(74,58,36,0.22);
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .dot.done { background: var(--sunset); }
  .dot.current { background: var(--barn); transform: scale(1.35); }

  .icon-btn {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(138,59,46,0.4);
    background: rgba(251,243,224,0.7);
    color: var(--barn);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(0.92); }

  .stage {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card {
    width: min(88vw, 30rem);
    min-height: 44vh;
    background: linear-gradient(180deg, var(--wheat-light), #f3e6c6);
    border: 2px solid rgba(138,59,46,0.28);
    border-radius: 26px;
    box-shadow: 0 18px 40px rgba(58,34,51,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 26px;
    transition: transform 0.28s cubic-bezier(.34,1.2,.5,1), opacity 0.28s ease;
  }
  .card.leaving-yes { transform: translateX(-130%) rotate(-14deg); opacity: 0; }
  .card.leaving-no  { transform: translateX(130%) rotate(14deg); opacity: 0; }
  .card.entering { transform: translateY(16px) scale(0.96); opacity: 0; }
  .q-text {
    font-size: clamp(1.6rem, 6.4vw, 2.5rem);
    font-weight: 600;
    line-height: 1.18;
    color: var(--dusk);
  }

  .choices {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 30rem;
  }
  .choice {
    flex: 1;
    border-radius: 18px;
    padding: 14px 10px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.08s ease;
  }
  .choice:active { transform: translateY(3px) scale(0.98); }
  .choice .big { font-family: 'Fraunces', serif; font-size: 1.5rem; }
  .choice .dir { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; }
  .choice.yes { background: rgba(217,165,68,0.18); color: var(--barn); border-color: rgba(217,165,68,0.5); }
  .choice.no  { background: rgba(47,93,115,0.14); color: var(--denim-deep); border-color: rgba(47,93,115,0.4); }
  .swipe-hint {
    font-size: 0.9rem;
    color: var(--cream-ink);
    opacity: 0.85;
    margin-top: 4px;
    min-height: 1.2em;
  }

  .speaking {
    display: inline-flex; gap: 4px; align-items: flex-end; height: 14px;
    opacity: 0; transition: opacity 0.2s ease;
  }
  .speaking.active { opacity: 1; }
  .speaking span {
    width: 3px; background: var(--barn); border-radius: 2px; height: 5px;
    animation: bar 0.7s ease-in-out infinite;
  }
  .speaking span:nth-child(2) { animation-delay: 0.14s; }
  .speaking span:nth-child(3) { animation-delay: 0.28s; }
  .speaking span:nth-child(4) { animation-delay: 0.42s; }
  @keyframes bar { 0%,100% { height: 4px; } 50% { height: 14px; } }

  /* answer flash overlay */
  .verdict {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-family: 'Fraunces', serif;
    font-size: clamp(3rem, 18vw, 7rem);
    font-weight: 700;
    opacity: 0;
  }
  .verdict.show { animation: pop 0.7s ease forwards; }
  .verdict.yes { color: var(--sunset); }
  .verdict.no  { color: var(--denim); }
  @keyframes pop {
    0% { opacity: 0; transform: scale(0.6); }
    25% { opacity: 1; transform: scale(1.05); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
  }

  /* ---------- Complete screen ---------- */
  #completeScreen h2 {
    font-size: clamp(2rem, 9vw, 3rem);
    margin: 0 0 10px;
    color: var(--dusk);
  }
  .tally {
    font-size: clamp(1.15rem, 5vw, 1.6rem);
    color: var(--barn);
    margin: 4px 0 28px;
    line-height: 1.4;
  }
  .tally b { color: var(--sunset); }
</style>
</head>
<body>

  <!-- Start -->
  <section class="screen" id="startScreen">
    <div class="kicker">A little country game</div>
    <h1>Yes <span class="amp">or</span> No</h1>
    <p class="subtitle">A voice asks, you swipe. Turn your sound on and get comfy on the porch.</p>
    <button class="btn" id="beginBtn">Let's Go</button>
    <p class="rule">Swipe <b>left for YES</b> &nbsp;·&nbsp; <b>right for NO</b></p>
  </section>

  <!-- Game -->
  <section class="screen" id="gameScreen">
    <div class="topbar">
      <div class="progress" id="progress"></div>
      <div class="speaking" id="speakingIndicator"><span></span><span></span><span></span><span></span></div>
      <button class="icon-btn" id="muteBtn" aria-label="Toggle music">♪</button>
    </div>

    <div class="stage">
      <div class="card entering" id="card">
        <div class="q-text" id="questionText">…</div>
      </div>
    </div>

    <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div class="choices">
        <div class="choice yes" id="choiceYes"><span class="big">Yes</span><span class="dir">← swipe left</span></div>
        <div class="choice no" id="choiceNo"><span class="big">No</span><span class="dir">swipe right →</span></div>
      </div>
      <div class="swipe-hint" id="hint">Swipe the card to answer</div>
    </div>
  </section>

  <!-- Complete -->
  <section class="screen" id="completeScreen">
    <div class="kicker">That's a wrap</div>
    <h2>Well done, darlin'</h2>
    <p class="tally" id="tally"></p>
    <button class="btn ghost" id="againBtn">Play Again</button>
    <p class="rule">…or tap anywhere to go again</p>
  </section>

  <div class="verdict" id="verdict"></div>

<script>

// a "no" is never made to sound like the wrong answer.

//   'Do you like Dolly Parton?',
const TRIAL_QUESTIONS = [];
// Random games deal from a shuffled "bag" of the whole pool, ten at a time, so
// no question comes back until all 100 have been asked; then the bag is
// reshuffled. The bag is remembered on this device between visits, so opening
// the page again carries on where the last game left off rather than starting
// a fresh random draw that could repeat recent questions.
const BAG_KEY = 'yesno-bag-v1';
function shuffledIndexes() {
  const order = QUESTION_POOL.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}
// Stored as { bag: questions still to come, last: the game just played }.
const validIndexes = a => Array.isArray(a) && new Set(a).size === a.length
  && a.every(i => Number.isInteger(i) && i >= 0 && i < QUESTION_POOL.length);
function loadBag() {
  try {
    const saved = JSON.parse(localStorage.getItem(BAG_KEY));
    // Anything malformed (or left over from a different-sized pool) is dropped.
    if (saved && validIndexes(saved.bag) && validIndexes(saved.last)) return saved;
  } catch (_) {}
  return { bag: [], last: [] };
}
function saveBag(saved) {
  try { localStorage.setItem(BAG_KEY, JSON.stringify(saved)); } catch (_) {}
}
// Without storage (a private window, say) the bag still works for as long as
// the page stays open.
let memoryBag = { bag: [], last: [] };
// The active round.
let deck = [];
function pickRound() {
  if (TRIAL_QUESTIONS.length) {
    deck = TRIAL_QUESTIONS.map(t => QUESTION_POOL.find(q => q.text === t)).filter(Boolean);
    return;
  }
  const size = Math.min(ROUND_SIZE, QUESTION_POOL.length);
  const saved = loadBag();
  const from = saved.bag.length || saved.last.length ? saved : memoryBag;
  const last = from.last;
  let bag = from.bag;
  if (bag.length < size) {
    // Top up with a fresh shuffle, leaving out what's still in the bag. The
    // game just played goes to the back of the new pass, so starting over
    // never repeats a question from the game before.
    const skip = new Set(bag), recent = new Set(last);
    const fresh = shuffledIndexes().filter(i => !skip.has(i));
    bag = bag.concat(fresh.filter(i => !recent.has(i)), fresh.filter(i => recent.has(i)));
  }
  const dealt = bag.slice(0, size);
  deck = dealt.map(i => QUESTION_POOL[i]);
  memoryBag = { bag: bag.slice(size), last: dealt };
  saveBag(memoryBag);
}
const INTRO_LINE = "Well howdy! Let's play a little game. I'll ask you some questions, and all you gotta do is swipe. There are no right or wrong answers. Swipe left for yes, swipe right for no. Alright darlin, here we go.";

/* ============================ Gesture tunables ============================ */
const SWIPE_MIN_DISTANCE = 34;   // px — needs a real swipe, not a tap
const TAP_MAX_DISTANCE = 10;
const TAP_MAX_TIME = 450;

/* ============================ Audio engine ============================ */
let audioCtx = null;
// Call from inside a tap or swipe wherever possible: iOS only lets a page
// start or resume its audio in response to the player touching it.
function ensureAudio() {
  if (!audioCtx) {
    // Leave the page's audio session at its default on purpose. Setting it to
    // 'playback' (so the silent switch wouldn't mute the music) made it
    // exclusive on iPhone: the music, starting a moment after the intro, cut
    // the speech voice off mid-sentence and it never came back. The default
    // lets the music and the voice play together.
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // iOS can pause ("interrupt") the context, for instance while the speech
    // voice has the audio. Pick it back up as soon as it's allowed.
    audioCtx.onstatechange = () => { if (audioCtx.state !== 'running') resumeAudio(); };
  }
  resumeAudio();
}
function resumeAudio() {
  if (!audioCtx || audioCtx.state === 'running' || audioCtx.state === 'closed') return;
  const p = audioCtx.resume();
  if (p && p.catch) p.catch(() => {});
}
function tone(freq, dur, type = 'sine', vol = 0.15, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}
// Little country-ish plucks for each answer.
const chimes = {
  yes() { tone(587.33, 0.3, 'triangle', 0.2); tone(880, 0.4, 'triangle', 0.16, 0.09); },
  no()  { tone(392, 0.32, 'triangle', 0.2); tone(311.13, 0.42, 'triangle', 0.16, 0.09); },
  done() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.5, 'triangle', 0.16, i * 0.12)); },
};

/* ------- Voice: the browser's built-in speech (no external audio) ------- */
let speechGen = 0;
let preferredVoice = null;

function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  // Prefer a warm US English voice to fit the country theme.
  preferredVoice =
    voices.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Ava|Allison|Nicky/i.test(v.name)) ||
    voices.find(v => /en[-_]US/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang)) ||
    voices[0];
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function setSpeaking(on) {
  const ind = document.getElementById('speakingIndicator');
  if (ind) ind.classList.toggle('active', on);
  duckMusic(on);
}
function cancelCurrent() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  setSpeaking(false);
}
// Speak a line of text, then call onEnd exactly once. Guarded by speechGen so a
// new line cancels a stale one's callback. A watchdog guarantees onEnd fires
// even if the browser never delivers `onend` (a known iOS quirk) — but it's
// generous and cleared the moment the line really ends, so it never cuts a line
// short or jumps ahead mid-sentence.
function speakLine(text, onEnd) {
  const myGen = ++speechGen;
  cancelCurrent();
  let finished = false, watchdog = null;
  const done = () => {
    if (finished || myGen !== speechGen) return;
    finished = true;
    if (watchdog) clearTimeout(watchdog);
    setSpeaking(false);
    if (onEnd) onEnd();
  };
  if (!('speechSynthesis' in window) || !text) {
    // No speech available: hold roughly as long as the line would take to read
    // so the pacing still feels right, then continue.
    watchdog = setTimeout(done, text ? Math.min(9000, 900 + text.length * 55) : 1000);
    return;
  }
  // iOS can leave speech stuck in a paused state after something else takes
  // the audio; if so, nothing new would ever be heard.
  if (speechSynthesis.paused) speechSynthesis.resume();
  const u = new SpeechSynthesisUtterance(text);
  if (preferredVoice) u.voice = preferredVoice;
  u.rate = 0.98; u.pitch = 1.0; u.volume = 1.0;
  u.onstart = () => { if (myGen === speechGen) setSpeaking(true); };
  u.onend   = done;
  u.onerror = done;
  watchdog = setTimeout(done, 2500 + text.length * 100);   // safety net only
  speechSynthesis.speak(u);
}

/* ============================ Background music ============================ */
// The looping country instrumental lives at yesno/audio/country-track.mp3.
// It plays as a decoded buffer through Web Audio rather than an <audio>
// element. On iPhone the speech voice takes over the page's audio and pauses a
// media element about a second into the intro, and iOS ignores an element's
// volume, so it could never be kept quiet or ducked under the voice. A buffer
// on a gain node has neither problem.
const MUSIC_SRC = 'audio/country-track.mp3';
const MUSIC_VOL = 0.14;      // quiet background — never prominent
const MUSIC_DUCK = 0.05;     // barely there while the voice is talking
let musicWanted = true;      // user's mute preference
let voiceActive = false;
let musicGain = null, musicSource = null, musicLoading = null;

function setMusicLevel(ms) {
  if (!musicGain) return;
  const target = !musicWanted ? 0 : voiceActive ? MUSIC_DUCK : MUSIC_VOL;
  const g = musicGain.gain, t = audioCtx.currentTime;
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(target, t + ms / 1000);
}
function loadMusic() {
  if (!musicLoading) {
    musicLoading = fetch(MUSIC_SRC)
      .then(r => { if (!r.ok) throw new Error('music ' + r.status); return r.arrayBuffer(); })
      .then(data => new Promise((ok, no) => {
        const p = audioCtx.decodeAudioData(data, ok, no);   // older Safari wants the callbacks
        if (p && p.then) p.then(ok, no);
      }))
      // Absent or undecodable: the game runs without music, and the next
      // start tries again.
      .catch(() => { musicLoading = null; return null; });
  }
  return musicLoading;
}
function startMusic() {
  if (!musicWanted || !audioCtx) return;
  if (musicSource) { setMusicLevel(900); return; }
  loadMusic().then(buf => {
    if (!buf || musicSource) return;
    if (!musicGain) {
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0;
      musicGain.connect(audioCtx.destination);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(musicGain);
    src.start();
    musicSource = src;
    setMusicLevel(900);
  });
}
// Duck the music under narration so the voice sits on top.
function duckMusic(voiceOn) {
  voiceActive = voiceOn;
  setMusicLevel(voiceOn ? 250 : 600);
}
// Muting just fades the track out; it keeps looping silently underneath, so
// unmuting picks straight back up with nothing to reload.
document.getElementById('muteBtn').addEventListener('click', () => {
  ensureAudio();
  musicWanted = !musicWanted;
  document.getElementById('muteBtn').textContent = musicWanted ? '♪' : '🔇';
  if (musicWanted) startMusic();
  else setMusicLevel(300);
});

/* ============================ Game state ============================ */
let index = 0;
let answers = [];          // 'yes' | 'no'
let acceptingInput = false;
let transitioning = false;

function buildProgress() {
  const wrap = document.getElementById('progress');
  wrap.innerHTML = '';
  deck.forEach(() => {
    const d = document.createElement('div');
    d.className = 'dot';
    wrap.appendChild(d);
  });
}
function paintProgress() {
  const dots = document.querySelectorAll('#progress .dot');
  dots.forEach((d, i) => {
    d.classList.toggle('done', i < index);
    d.classList.toggle('current', i === index);
  });
}

function showQuestion() {
  const q = deck[index];
  const card = document.getElementById('card');
  document.getElementById('questionText').textContent = q.text;
  document.getElementById('hint').textContent = 'Swipe the card to answer';
  paintProgress();
  // enter animation
  card.className = 'card entering';
  void card.offsetWidth;
  card.className = 'card';
  transitioning = false;
  acceptingInput = false;   // no answers until the question has been read
  speakLine(q.text, () => { acceptingInput = true; });
  // Safety: if speech never fires (e.g. muted device), open input anyway —
  // but only for this question, never the one after it.
  const shown = index;
  setTimeout(() => { if (index === shown && !transitioning) acceptingInput = true; }, 2600);
}

function flashVerdict(kind) {
  const v = document.getElementById('verdict');
  v.textContent = kind === 'yes' ? 'YES' : 'NO';
  v.className = 'verdict ' + kind;
  void v.offsetWidth;
  v.classList.add('show');
}

function answer(kind) {
  if (!acceptingInput || transitioning) return;
  acceptingInput = false;
  transitioning = true;
  answers[index] = kind;
  ensureAudio();   // a swipe is a touch, so iOS lets us wake the audio here

  const card = document.getElementById('card');
  card.classList.add(kind === 'yes' ? 'leaving-yes' : 'leaving-no');
  flashVerdict(kind);
  chimes[kind]();

  // Say this question's own reply (it opens with "Yes" or "No", so the player
  // hears which way the swipe registered), then advance.
  const reaction = deck[index][kind];

  let advanced = false;
  const go = () => {
    if (advanced) return;
    advanced = true;
    index++;
    if (index >= deck.length) finish();
    else showQuestion();
  };
  // No separate timer: speakLine's watchdog guarantees `go` runs, and a fixed
  // one would cut the longer replies off mid-sentence.
  speakLine(reaction, go);
}

function finish() {
  const yes = answers.filter(a => a === 'yes').length;
  document.getElementById('tally').innerHTML =
    `You said <b>YES</b> to ${yes} of ${deck.length}.`;
  document.body.classList.remove('in-game');
  document.body.classList.add('complete');
  // Speak the result AND the replay instruction, since the game is audio-first.
  const spoken = `And that's the whole hoedown! You said yes to ${yes} out of ${deck.length}. `
    + `To play again, just tap anywhere on the screen.`;
  speakLine(spoken);
}

let hasPlayed = false;
const REPLAY_LINE = "Alright, here we go again! Swipe left for yes, right for no.";
function startGame() {
  index = 0;
  answers = [];
  pickRound();                 // trial set, or a fresh random 10
  // Neutralise the card so no leftover question lingers while the opening plays.
  document.getElementById('questionText').textContent = '…';
  document.getElementById('card').className = 'card';
  document.getElementById('verdict').className = 'verdict';
  document.body.classList.remove('complete');
  document.body.classList.add('in-game');
  buildProgress();
  // First game reads the FULL intro ("swipe left for yes, right for no"), then —
  // and only then — the first question (speakLine's watchdog guarantees onEnd
  // fires, so no separate timer is needed; the old one cut the intro off early).
  // Replays get a shorter nudge since the player already knows the controls.
  const opening = hasPlayed ? REPLAY_LINE : INTRO_LINE;
  hasPlayed = true;
  speakLine(opening, () => showQuestion());
}

/* ============================ Input ============================ */
// Swipe LEFT = YES, swipe RIGHT = NO (as requested).
let touchStartX = 0, touchStartY = 0, touchStartT = 0, touchInProgress = false;

function bindGestures() {
  document.addEventListener('touchstart', onTouchStart, { passive: false });
  document.addEventListener('touchend', onTouchEnd, { passive: false });
  document.addEventListener('touchcancel', () => { touchInProgress = false; }, { passive: false });
  document.addEventListener('touchmove', (e) => { if (document.body.classList.contains('in-game')) e.preventDefault(); }, { passive: false });
}
function onTouchStart(e) {
  if (e.touches.length !== 1) { touchInProgress = false; return; }
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchStartT = Date.now(); touchInProgress = true;
}
function onTouchEnd(e) {
  if (!touchInProgress) return;
  touchInProgress = false;
  if (!document.body.classList.contains('in-game')) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) < SWIPE_MIN_DISTANCE || Math.abs(dx) < Math.abs(dy)) return;
  answer(dx < 0 ? 'yes' : 'no');   // left = yes, right = no
}

// Desktop helpers: arrow keys + tapping the Yes/No labels.
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('in-game')) return;
  if (e.key === 'ArrowLeft')  answer('yes');
  if (e.key === 'ArrowRight') answer('no');
});
document.getElementById('choiceYes').addEventListener('click', () => answer('yes'));
document.getElementById('choiceNo').addEventListener('click', () => answer('no'));

/* ============================ Boot ============================ */
// Tap anywhere on the start screen to begin (same as Ballycrann — the button
// is just the visual affordance). `once` so it only fires the first time.
document.getElementById('startScreen').addEventListener('click', () => {
  ensureAudio();
  startMusic();
  startGame();
}, { once: true });
// Tap anywhere on the complete screen to play again (the button is just the
// affordance). Guard on the class so it only fires while that screen is up and
// re-arms itself every time the game ends.
document.getElementById('completeScreen').addEventListener('click', () => {
  if (!document.body.classList.contains('complete')) return;
  ensureAudio();
  startMusic();
  startGame();
});
// Coming back to the page (after locking the phone, say): wake the audio if
// the browser allows it without a touch; otherwise the next swipe will.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') resumeAudio();
});
bindGestures();
</script>
</body>
</html>
